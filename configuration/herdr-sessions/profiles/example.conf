# example — copy to profiles/<your-host>.conf and fill in your own paths.
#
# HS_SCOPE picks which unit set install.sh renders:
#   user    sessions run as a normal login user -> ~/.config/systemd/user
#           (needs `sudo loginctl enable-linger <user>` to start at boot)
#   system  sessions run as root, no login session at boot -> /etc/systemd/system
HS_SCOPE=user

# Working directory every herdr pane inherits. This is also the project key
# `claude --continue` resolves against, so keep it stable.
HS_WORKDIR=/home/youruser/code/your-project

HS_TAG=herdr-sessions
# Absolute path to the herdr you run. install.sh splices it into the units and
# refuses an install where it is not executable, and the driver runs the same
# value, so the two can never disagree. A leading `%h/` means this user's home
# in both (it is the unit default, `%h/.local/bin/herdr`); a `%` anywhere else
# is a literal character in the path, not a specifier.
HERDR_BIN=/home/youruser/.local/bin/herdr
HERDR_SOCKET=/home/youruser/.config/herdr/herdr.sock
STATE_DIR=/home/youruser/.local/state/herdr-sessions

# full = resume the whole conversation, never the "recommended" summary.
RESUME_MODE=full

# What to do when there is no usable snapshot:
#   none      do nothing and let a human look (right when several sessions share
#             one directory -- `claude --continue` would guess wrong)
#   continue  run `claude --continue` in FALLBACK_PANE (right on a single-session host)
FALLBACK=continue
FALLBACK_NAME=main
FALLBACK_CWD=/home/youruser/code/your-project
FALLBACK_PANE=first

# always = force Remote Control on; snapshot = honour whatever each session had.
REMOTE_CONTROL=always

WAIT_SOCKET_SEC=120
WAIT_PROMPT_SEC=60
