# AutoOS LiteLLM router — MANUAL FALLBACK. Primary is OmniRoute (:20128,
# docs/models.md), which tracks free-tier churn automatically. Use this when
# you want LiteLLM instead: same tier names, static chains.
#
# Cost efficiency is the design goal, hence the 2-level hierarchy:
#   t2-worker      smart second level — strong reasoning, free quotas.
#   t3-driver      daily driver — codegen, research, review, lint. Cheapest.
#   tierN-paid paid escalation for tierN, tried in listed order.
#
# Paid rule: escalation is deepseek-v4.1-flash on direct DeepSeek. Nothing
# expensive is routed by default. OpenRouter is off entirely (provider-level
# available: false, DSMAX 2026-09-27), so the muse-spark-1.3 orchestration
# tiers (t1-orchestrator, t1-orchestrator-clean, spark-1.3-contributor,
# t2-orchestrator) have no leg LiteLLM can address and get no group.
#
# 2026-09 corrections (OmniRoute re-audit): Cerebras no-card 1M/day is GONE
# ($5 credit, card required) — dropped. Groq llama-3.3-70b left free tier
# 2026-08-16 — dropped. Gemini free was cut 50-80% Dec 2025, Flash pooled.
# Biggest documented free pool is now Mistral (1B/mo per org, 2 RPM).
#
# Every tier the registry can serve through LiteLLM is an AUTOOS-MANAGED block
# (its legs regenerated by tools/sync-router-tiers.py from
# catalog/ai-registry.json `routes.<tier>.legs`). A route whose every leg is
# gateway-only, unavailable or policy-denied simply gets no group. The *-paid
# fallback chains carry no `legs` and stay hand-curated.
#
# Run:  litellm --config configuration/litellm/config.yaml --port 4000
# Test: litellm --config configuration/litellm/config.yaml --test
# Keys live in configuration/litellm/.env (git-ignored). Copy .env.example first.
# Key guide: docs/api-keys.md

model_list:
  # ── t2-worker: smart second level, free quotas ─────────────────────────
  # Mirror of registry routes.t2-worker (single source of truth), kept in sync
  # by tools/sync-router-tiers.py: the markers below delimit a machine-owned
  # block - legs inside are regenerated, everything outside is untouched.
  # AUTOOS-MANAGED-START t2-worker
  - model_name: t2-worker
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY
      rpm: 10 # AI Studio free: Flash-family pooled, dynamic limits
  - model_name: t2-worker
    litellm_params:
      model: openai/kimi-k3
      api_base: https://api.cheaperinference.com/v1
      api_key: os.environ/CHEAPINFERENCE_API_KEY
  - model_name: t2-worker
    litellm_params:
      model: deepseek/deepseek-flash
      api_key: os.environ/DEEPSEEK_API_KEY
  # AUTOOS-MANAGED-END t2-worker

  # ── t2-worker-clean: no free/hand legs, gateway-only stripped ─────────────
  # AUTOOS-MANAGED-START t2-worker-clean
  - model_name: t2-worker-clean
    litellm_params:
      model: deepseek/deepseek-flash
      api_key: os.environ/DEEPSEEK_API_KEY
  - model_name: t2-worker-clean
    litellm_params:
      model: mistral/mistral-small-latest
      api_key: os.environ/MISTRAL_API_KEY
  # AUTOOS-MANAGED-END t2-worker-clean

  # ── t2-worker-free-only: zero spend ────────────────────────────────────────
  # Mirror of the registry route MINUS the gateway-only legs (antigravity/cc
  # carry no LiteLLM transport). The groq/cerebras/sambanova gpt-oss legs are
  # gone (OR1d, 2026-09-27): all three are dead through the gateway.
  # No fallbacks entry.
  # AUTOOS-MANAGED-START t2-worker-free-only
  - model_name: t2-worker-free-only
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY
      rpm: 10 # AI Studio free: Flash-family pooled, dynamic limits
  - model_name: t2-worker-free-only
    litellm_params:
      model: openai/qwen7b
      api_base: https://api.free.ai/v1
      api_key: os.environ/FREE_AI_API_KEY
  # AUTOOS-MANAGED-END t2-worker-free-only

  # ── t2-worker-paid / t3-driver-paid: the escalation must actually answer ────
  # Direct DeepSeek only: the OpenRouter leg that used to lead (a deployment
  # distinct from the tier chains, so a cooled shared `deepseek/deepseek-flash`
  # could not dead-end the escalation) went with OpenRouter itself
  # (DSMAX 2026-09-27). The group now shares that deployment with the tier
  # chains. Zen removed 2026-09 (402s without balance).
  - model_name: t2-worker-paid
    litellm_params:
      model: deepseek/deepseek-flash
      api_key: os.environ/DEEPSEEK_API_KEY

  # ── t3-driver: daily driver, cheapest capable ──────────────────────────
  # Mirror of registry routes.t3-driver (see the t2-worker note above).
  # AUTOOS-MANAGED-START t3-driver
  - model_name: t3-driver
    litellm_params:
      model: mistral/mistral-code-latest
      api_key: os.environ/MISTRAL_API_KEY
  - model_name: t3-driver
    litellm_params:
      model: openai/glm-5.2
      api_base: https://api.cheaperinference.com/v1
      api_key: os.environ/CHEAPINFERENCE_API_KEY
  - model_name: t3-driver
    litellm_params:
      model: deepseek/deepseek-flash
      api_key: os.environ/DEEPSEEK_API_KEY
  - model_name: t3-driver
    litellm_params:
      model: openai/kimi-k3
      api_base: https://api.cheaperinference.com/v1
      api_key: os.environ/CHEAPINFERENCE_API_KEY
  - model_name: t3-driver
    litellm_params:
      model: openai/minimax-m2.7
      api_base: https://api.cheaperinference.com/v1
      api_key: os.environ/CHEAPINFERENCE_API_KEY
  - model_name: t3-driver
    litellm_params:
      model: mistral/mistral-small-latest
      api_key: os.environ/MISTRAL_API_KEY
      rpm: 2
  # AUTOOS-MANAGED-END t3-driver

  # ── t3-driver-clean: gateway-only legs stripped ────────────────────────────
  # AUTOOS-MANAGED-START t3-driver-clean
  - model_name: t3-driver-clean
    litellm_params:
      model: deepseek/deepseek-flash
      api_key: os.environ/DEEPSEEK_API_KEY
  - model_name: t3-driver-clean
    litellm_params:
      model: mistral/mistral-small-latest
      api_key: os.environ/MISTRAL_API_KEY
  # AUTOOS-MANAGED-END t3-driver-clean

  # ── t3-driver-free-only: zero spend ────────────────────────────────────────
  # Mirror of registry routes.t3-driver-free-only MINUS the gateway-only legs.
  # The groq/cerebras qwen legs are dead through the gateway (OR1d, 2026-09-27);
  # free_ai/qwen7b is the only servable leg left.
  # AUTOOS-MANAGED-START t3-driver-free-only
  - model_name: t3-driver-free-only
    litellm_params:
      model: openai/qwen7b
      api_base: https://api.free.ai/v1
      api_key: os.environ/FREE_AI_API_KEY
  # AUTOOS-MANAGED-END t3-driver-free-only

  # ── t3-driver-paid: same shape as t2-worker-paid (see the note above) ──────
  - model_name: t3-driver-paid
    litellm_params:
      model: deepseek/deepseek-flash
      api_key: os.environ/DEEPSEEK_API_KEY

  # ── t4-rag: cohere RAG standby ────────────────────────────────────────────
  # Trial keys, 128k. drop_params: opencode sends OpenAI-style `strict`, which
  # cohere rejects as an unknown field (measured 2026-09-22) — drop it per leg.
  # additional_drop_params: global/per-model drop_params does NOT cover
  # `strict`; it must be named explicitly (same session, verified).
  # AUTOOS-MANAGED-START t4-rag
  - model_name: t4-rag
    litellm_params:
      model: cohere/command-a-03-2025
      api_key: os.environ/COHERE_API_KEY
      drop_params: true
      additional_drop_params: ["strict"]
  - model_name: t4-rag
    litellm_params:
      model: cohere/command-r-plus-08-2024
      api_key: os.environ/COHERE_API_KEY
      drop_params: true
      additional_drop_params: ["strict"]
  # AUTOOS-MANAGED-END t4-rag

  # ── deepseek-v4.1-flash / gemini-3.8-flash: bare model aliases ────────────
  # AUTOOS-MANAGED-START deepseek-v4.1-flash
  - model_name: deepseek-v4.1-flash
    litellm_params:
      model: deepseek/deepseek-flash
      api_key: os.environ/DEEPSEEK_API_KEY
  # AUTOOS-MANAGED-END deepseek-v4.1-flash

  # AUTOOS-MANAGED-START gemini-3.8-flash
  - model_name: gemini-3.8-flash
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY
  # AUTOOS-MANAGED-END gemini-3.8-flash

  # ── cheaperinference pinned single-model aliases ───────────────────────────
  # AUTOOS-MANAGED-START cheaperinference/glm-5.2
  - model_name: cheaperinference/glm-5.2
    litellm_params:
      model: openai/glm-5.2
      api_base: https://api.cheaperinference.com/v1
      api_key: os.environ/CHEAPINFERENCE_API_KEY
  # AUTOOS-MANAGED-END cheaperinference/glm-5.2

  # AUTOOS-MANAGED-START cheaperinference/kimi-k3
  - model_name: cheaperinference/kimi-k3
    litellm_params:
      model: openai/kimi-k3
      api_base: https://api.cheaperinference.com/v1
      api_key: os.environ/CHEAPINFERENCE_API_KEY
  # AUTOOS-MANAGED-END cheaperinference/kimi-k3

router_settings:
  # simple-shuffle: deterministic and DB-less. `usage-based-routing-v2` tracks
  # per-deployment usage in Postgres/Redis, so with no DB the same deployment
  # is shared by t2-worker/t3-driver/*-clean and its cooldown state leaks across
  # groups - one 402 in one group reappears as a 402 in unrelated groups
  # (measured 2026-09-22). This proxy is a manual fallback, not a load
  # balancer: predictability beats least-used scoring here.
  routing_strategy: simple-shuffle
  num_retries: 3
  timeout: 600 # long-horizon orchestration needs headroom, not the 5-min default
  allowed_fails: 3
  cooldown_time: 120 # cool a 429ing deployment for 2 min, serve from the rest
  fallbacks:
    - t2-worker: [t2-worker-paid]
    - t3-driver: [t3-driver-paid]
    - t4-rag: [t2-worker-paid] # trial-key RAG fails over to the paid escalation

litellm_settings:
  drop_params: true # heterogeneous providers reject unknown params; drop, don't fail
  num_retries: 3

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
