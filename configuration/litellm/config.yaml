router_settings:
  # simple-shuffle: deterministic and DB-less. `usage-based-routing-v2` tracks
  # per-deployment usage in Postgres/Redis, so with no DB the same deployment
  # is shared by t2-worker/t3-driver/*-clean and its cooldown state leaks across
  # groups - one 402 in one group reappears as a 402 in unrelated groups
  # (measured 2026-09-22). This proxy is a manual fallback, not a load
  # balancer: predictability beats least-used scoring here.
  routing_strategy: simple-shuffle
  num_retries: 3
  timeout: 600 # long-horizon orchestration needs headroom, not the 5-min default
  allowed_fails: 3
  cooldown_time: 120 # cool a 429ing deployment for 2 min, serve from the rest
  # No fallback chains (PROVFIX3, review PROV round 2 finding 5). The three
  # chains this file carried (t2-worker -> t2-worker-paid, t3-driver ->
  # t3-driver-paid, t4-rag -> t2-worker-paid) all ended in a hand group whose
  # only deployment is deepseek/deepseek-flash, which was an unservable dead
  # end while providers.deepseek was off (402 without balance) — the
  # "escalation" spent its retries on the same dead provider it was escaping.
  # DSBACK 2026-09-28 topped that balance up (router balance 19.99 USD), so the
  # deployment answers again, but the chains stay down: re-adding one is an
  # operator call, and openrouter — the other route they used to end in — is
  # still off at the provider level. Re-add a chain only when its target
  # actually answers;
  # tests/test_registry_render.py::LitellmFallbackServabilityTests asserts it.
  # The two paid groups below stay hand-curated.
  fallbacks: []

litellm_settings:
  drop_params: true # heterogeneous providers reject unknown params; drop, don't fail
  num_retries: 3

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
