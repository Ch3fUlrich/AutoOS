# AutoOS LiteLLM router — MANUAL FALLBACK. Primary is OmniRoute (:20128,
# docs/models.md), which tracks free-tier churn automatically. Use this when
# you want LiteLLM instead: same tier names, static chains.
#
# Cost efficiency is the design goal, hence the 2-level hierarchy:
#   t2-worker      smart second level — strong reasoning, free quotas.
#   t3-driver      daily driver — codegen, research, review, lint. Cheapest.
#   tierN-paid paid escalation for tierN, tried in listed order.
#
# Paid rule (PROVFIX3 finding 4 — this header contradicted the file under it):
# an escalation is only worth routing when a leg answers. Direct DeepSeek is back
# on (DSBACK 2026-09-28: operator top-up, router balance 19.99 USD) but the two
# hand chains that used to deploy only it (t2-worker-paid, t3-driver-paid) declare
# no registry `legs` and stay hand-curated, so nothing here changed for them;
# router_settings.fallbacks is still empty because the chains that did answer are
# gone (note at the key — OpenRouter remains off at the provider level, DSMAX
# 2026-09-27). MUSEAPI 2026-09-27 moved the paid escalation that does
# answer onto meta_api direct: an OpenAI-compatible endpoint with its own
# api_base, so t1-orchestrator, t1-orchestrator-paid and spark-1.3-contributor
# are AUTOOS-MANAGED groups with real legs. OpenRouter is off entirely
# (provider-level available: false, DSMAX 2026-09-27), so the muse-spark-1.3
# tiers it used to reach (t1-orchestrator-clean, t2-orchestrator) have no leg
# LiteLLM can address and get no group.
#
# 2026-09 corrections (OmniRoute re-audit): Cerebras no-card 1M/day is GONE
# ($5 credit, card required) — dropped. Groq llama-3.3-70b left free tier
# 2026-08-16 — dropped. Gemini free was cut 50-80% Dec 2025, Flash pooled.
# Biggest documented free pool is now Mistral (1B/mo per org, 2 RPM).
#
# Every tier the registry can serve through LiteLLM is an AUTOOS-MANAGED block
# (its legs regenerated by tools/sync-router-tiers.py from
# catalog/ai-registry.json `routes.<tier>.legs`). A route whose every leg is
# gateway-only, unavailable or policy-denied simply gets no group. Of the paid
# chains, only t2-worker-paid and t3-driver-paid carry no `legs` and stay
# hand-curated; t1-orchestrator-paid has a registry leg since MUSEAPI and is
# managed like the tiers.
#
# Run:  litellm --config configuration/litellm/config.yaml --port 4000
# Test: litellm --config configuration/litellm/config.yaml --test
# Keys live in configuration/litellm/.env (git-ignored). Copy .env.example first.
# Key guide: docs/api-keys.md

