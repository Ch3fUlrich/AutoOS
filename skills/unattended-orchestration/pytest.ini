# Why this file exists: libtmux ships a pytest plugin that pytest loads
# automatically via entry point. Measured 2026-09-11 in WSL with pytest 9.1.1 and
# libtmux 0.53.0, that plugin dies at startup ("Marks cannot be applied to
# fixtures") and takes the ENTIRE suite with it -- collection never begins, so
# the failure looks like this skill is broken when nothing here is.
#
# libtmux arrives as a CAO dependency, so any host that can actually run this
# lane is a host where the suite refuses to start. Nothing here imports libtmux,
# so blocking its plugin costs nothing.
#
# It lives beside the skill rather than at the repo root so a copied skill keeps
# working: the foreign-repo test runs pytest against the copy, and the copy
# carries this file.
[pytest]
addopts = -p no:libtmux
