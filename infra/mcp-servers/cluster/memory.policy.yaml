version: 1

# Per-graph bundle for the `memory` graph (applies_to: [memory]).
groups:
  operators: [default]
  plangraph-kg-export: [plangraph-kg-export]

rules:
  - id: operators-memory-access
    allow:
      actors: { group: operators }
      actions: [read, export, change, schema_apply, branch_create, branch_delete, branch_merge, invoke_query]

  # Read-only knowledge-graph export actor (plan tracker). Same bundle, NOT a separate
  # one: cluster-mode serving refuses to boot when two bundles bind one graph.
  - id: plangraph-kg-export-read-only
    allow:
      actors: { group: plangraph-kg-export }
      actions: [read, export, invoke_query]
