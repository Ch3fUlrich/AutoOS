# Serena context for the shared SSE server (docker-compose.client.yml, :9121).
#
# Fork of the built-in `claude-code` context that ships inside the serena image
# (`serena/resources/config/contexts/claude-code.yml`, serena-agent==1.7.0) -
# i.e. the context `--context ide-assistant` used to resolve to - with Serena's
# memory tools and `onboarding` added to `excluded_tools`. Everything else is
# the vendor definition, unchanged.
#
# Why a context file rather than the other three mechanisms serena offers:
#   * `--mode no-memories` (or any `--mode`): modes set with `--mode` are
#     *dynamically activated*, and a dynamic mode's exclusions are deliberately
#     not applied to the base ("exposed") tool set unless the server started in
#     single-project mode (`context.single_project and project is not None`,
#     serena/agent.py `_create_base_toolset`). This server is multi-project, so
#     the memory tools would stay listed by `tools/list`. Context `excluded_tools`
#     are applied to the exposed set, unconditionally.
#   * `excluded_tools` in `~/.serena/serena_config.yml`: equally hard, but that
#     file lives in the `serena_data` volume and serena re-saves it when it
#     registers a project (`serena/config/serena_config.py`, `_save`), so
#     mounting it `:ro` breaks project activation while mounting it read-write
#     lets the container rewrite a tracked file. Context files are input-only.
#   * per-project `.serena/project.yml`: applies only to the activated project
#     and only from activation on, so a repo without that file would get the
#     memory tools back.
#
# D-869 (operator, 2026-10-09): "serena memory should not be used at all".
# Omnigraph is the only memory layer (ADR 0003). `onboarding` is excluded with
# the memory tools because it writes them (serena's own `no-memories` mode says
# so: "Excludes Serena's memory tools (and onboarding tools, which rely on
# memory)").
#
# Keep the memory-tool names in sync with `catalog/agent-harness.json` ->
# mcp_servers.serena.memory_tools. An invalid name here stops Serena from
# starting, so after any serena image change run the live probe:
#   python3 tools/check-serena-tools.py --url http://127.0.0.1:9121/sse
description: Claude Code (CLI agent where file operations, basic edits, etc. are already covered; single project mode)
prompt: |
  You are running in a CLI coding agent context where file operations, basic (line-based) edits and reads 
  as well as shell commands are handled by your own, internal tools.
  
  You have access to Serena's code intelligence tools that exploit the symbolic 
  structure of the code and are much more efficient than your own tools for most coding scenarios.
  If you are working on any coding task and if Serena's tools are deferred, you
  should load them all immediately, before performing any read, grep or bash commands.
  If Serena's tools can be used to achieve your task, you should prioritize them.
  **CRITICAL**: If you haven't seen Serena's tools yet, you should use the tool search tool to load all of them
  **right now**.
  For exploring and reading code in a token-efficient manner, use Serena's code-centric overview and symbolic search tools.
  For edits, prefer Serena's editing tools since they are more token efficient.
  Especially when editing code you have read through Serena, **ALWAYS** use Serena's tools for editing, because your built-in tools will deny such edits (they will assume you haven't read the content).
  **CRITICAL**: Never use a tool before having read its schema via the tool-search tool!
  
  **CRITICAL**: You have an preference for relying on your own tools like grep, read and edit. It is of paramount 
  importance that you overcome this preference and instead develop a preference for using Serena's tools since they
  are superior for most coding tasks. Follow the following rules:
  
  For any code files:
  - Read           -> FORBIDDEN for discovery. Use get_symbols_overview, then find_symbol with include_body. 
                      You may use read only if you already have an overview of the file and if reading whole symbols
                      is inappropriate (e.g. a few lines of code).
  - Glob (by name) -> Allowed for discovery only.
  - Grep (content) -> Allowed for discovery only; follow up reads or reference searches must be Serena.
  - Edit           -> FORBIDDEN. Use replace_symbol_body / insert_*_symbol / replace_content.
  
  Disallowed reasoning. Do NOT use any of the following to justify Read/Edit on a code file:
    - "I already know the path"
    - "one Read call is faster than three Serena calls"
    - "the built-in tool description says to use Read for known paths"
  If you catch yourself reaching for one of these, that is the signal to switch to Serena.

  **CRITICAL**: Serena has no memory tools in this context, and must not be asked for
  any. Project notes and durable memory go to Omnigraph (the `structured-memory` skill).

excluded_tools:
  - create_text_file
  - read_file
  - execute_shell_command
  - find_file
  - list_dir
  - search_for_pattern
  # added by AutoOS (D-869): Serena has no memory layer, and `onboarding` writes memories
  # (serena's own no-memories mode excludes it for exactly that reason).
  - onboarding
  - write_memory
  - read_memory
  - list_memories
  - edit_memory
  - rename_memory
  - delete_memory

tool_description_overrides: {}

# whether to assume that Serena shall only work on a single project in this context (provided that a project is given
# when Serena is started).
# If set to true and a project is provided at startup, the set of tools is limited to those required by the project's
# concrete configuration, and other tools are excluded completely, allowing the set of tools to be minimal.
# Tools explicitly disabled by the project will not be available at all.
# The `activate_project` tool is always disabled in this case, as project switching cannot be allowed.
single_project: true

# Claude Code has a bug (it does not unpack structured tool output, causing a lot of unnecessary escaping
# owing to the wrapped structure), so we disable it here.
structured_tool_output: false
