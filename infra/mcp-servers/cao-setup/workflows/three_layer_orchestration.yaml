name: three_layer_orchestration
description: |
  3-Layer CAO Orchestration Workflow.

  Demonstrates the canonical hierarchy:
    Layer 1  —  This workflow (Main Orchestrator)
    Layer 2  —  agy_supervisor  (Phase Supervisor, spawned in step 1)
    Layer 3  —  agy_developer + agy_reviewer  (Worker Subagents, spawned BY the supervisor)

  The workflow submits a user-defined task to a Phase Supervisor, waits for
  completion, then runs a final review gate. The supervisor internally spawns
  worker sessions for implementation and review — the workflow never talks
  to workers directly.

  Run:
    cao workflow run three_layer_orchestration --input task="<your task>"
    cao workflow run three_layer_orchestration --input task="<task>" --input repo="/absolute/path"

inputs:
  task:
    type: string
    required: true
  repo:
    type: path
    required: false
    default: "."

mode: sequential

steps:
  - id: phase_supervisor
    provider: antigravity
    agent: agy_supervisor
    prompt: |
      You are the Phase Supervisor (Layer 2) in a 3-layer CAO orchestration hierarchy.

      ## Your task
      {{ inputs.task }}

      ## Working directory
      {{ inputs.repo }}

      ## What you must do
      1. Break the task above into concrete, isolated sub-tasks.
      2. For each sub-task requiring implementation, spawn an `agy_developer` worker via `assign` or `handoff`.
      3. After implementation, spawn an `agy_reviewer` worker to review the code.
      4. Iterate until the reviewer approves (APPROVED verdict).
      5. Summarize what was completed, what files were changed, and what guards passed.
      6. End your session cleanly when the phase is done.

      ## Memory
      Use Omnigraph MCP tools for persistent cross-session memory. Do NOT use `memory_store` / `memory_recall`.

      ## Completion signal
      When done, emit a summary in this format:
      ```
      PHASE COMPLETE
      Files changed: <list>
      Tests run: <list and results>
      Outstanding issues: <none or list>
      ```
    output_schema:
      type: object
      properties:
        summary:
          type: string
        files_changed:
          type: array
          items:
            type: string
        tests_passed:
          type: boolean
      required:
        - summary

  - id: final_review_gate
    provider: antigravity
    agent: agy_reviewer
    prompt: |
      You are the Final Reviewer (Layer 3) performing a post-phase quality gate.

      ## Context from the Phase Supervisor
      {{ steps.phase_supervisor.output.summary }}

      ## Repository
      {{ inputs.repo }}

      ## Your task
      1. Verify the phase summary is complete and accurate.
      2. Run any relevant tests or linters in the working directory.
      3. Check that no regressions were introduced.
      4. Issue a final verdict: APPROVED or NEEDS_REVISION with specific issues.

      ## Completion signal
      End with either:
        FINAL VERDICT: APPROVED
        FINAL VERDICT: NEEDS_REVISION — <reason>
    output_schema:
      type: object
      properties:
        verdict:
          type: string
        issues:
          type: string
      required:
        - verdict
