# AutoOS LiteLLM router — single front door for every agent in this repo.
#
# Tiers (free-first, paid fallback). Docs: docs/models.md
#   tier1      orchestrator — long-horizon, tool-calling, high context
#   tier2      smart second level — Muse Spark 1.3 family (xhigh effort)
#   tier3      daily driver — codegen, research, review, lint
#   tierN-paid paid escalation for tierN, tried in listed order
#
# Run:  litellm --config infra/litellm/config.yaml --port 4000
# Test: litellm --config infra/litellm/config.yaml --test
# Keys live in infra/litellm/.env (git-ignored). Copy .env.example first.

model_list:
  # ── tier1 FREE: long-horizon reasoning, generous free quotas ──
  - model_name: tier1
    litellm_params:
      model: cerebras/gpt-oss-120b
      api_key: os.environ/CEREBRAS_API_KEY
      rpm: 30 # free tier: 30 RPM / 1M tokens per day
  - model_name: tier1
    litellm_params:
      model: groq/openai/gpt-oss-120b
      api_key: os.environ/GROQ_API_KEY
      rpm: 30 # free tier: ~30 RPM / ~1k req per day
  - model_name: tier1
    litellm_params:
      model: gemini/gemini-2.5-flash
      api_key: os.environ/GEMINI_API_KEY
      rpm: 10 # AI Studio free: up to ~1500 req/day on Flash; stay conservative

  # ── tier1 PAID escalation (tried in order, cheapest capable first) ──
  - model_name: tier1-paid
    litellm_params:
      model: openai/claude-opus-5
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/OPENCODE_ZEN_API_KEY
  - model_name: tier1-paid
    litellm_params:
      model: openai/kimi-k2.7-code
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/OPENCODE_ZEN_API_KEY
  # Flagship, matches the Claude Code Desktop orchestrator. Most expensive —
  # last resort on purpose. NOTE: Zen documents Fable under the /responses
  # endpoint; if `litellm --test` shows a path error here, point this entry
  # at your Anthropic-direct key instead (see docs/models.md).
  - model_name: tier1-paid
    litellm_params:
      model: openai/claude-fable-5-1
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/OPENCODE_ZEN_API_KEY

  # ── tier2 FREE then PAID: Muse Spark 1.3 family ──
  # Contributor-free = heavily discounted in exchange for training-data use.
  # Never route private repo code here; that is what the paid entry is for.
  - model_name: tier2
    litellm_params:
      model: openai/muse-spark-1.3-contributor-free
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/OPENCODE_ZEN_API_KEY
  - model_name: tier2-paid
    litellm_params:
      model: openai/muse-spark-1.3
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/OPENCODE_ZEN_API_KEY
  # xhigh = highest reasoning-effort tier of the 1.3 family. Effort is a
  # provider-side control (Muse Code "Max" level); the alias above resolves
  # to the 1.3 family and the effort control lives in the caller. The native
  # route is the Meta Model API (https://ai.developer.meta.com), also
  # OpenAI-compatible — swap api_base/api_key if you go direct.

  # ── tier3 FREE: cheap, fast, coding-capable ──
  - model_name: tier3
    litellm_params:
      model: groq/llama-3.3-70b-versatile
      api_key: os.environ/GROQ_API_KEY
      rpm: 30
  - model_name: tier3
    litellm_params:
      model: mistral/devstral-small-latest
      api_key: os.environ/MISTRAL_API_KEY
  - model_name: tier3
    litellm_params:
      model: mistral/mistral-small-latest
      api_key: os.environ/MISTRAL_API_KEY

  # ── tier3 PAID escalation ──
  - model_name: tier3-paid
    litellm_params:
      model: openai/deepseek-v4.1-flash
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/OPENCODE_ZEN_API_KEY
  - model_name: tier3-paid
    litellm_params:
      model: deepseek/deepseek-chat
      api_key: os.environ/DEEPSEEK_API_KEY
  - model_name: tier3-paid
    litellm_params:
      model: openai/claude-sonnet-5
      api_base: https://opencode.ai/zen/v1
      api_key: os.environ/OPENCODE_ZEN_API_KEY

router_settings:
  routing_strategy: usage-based-routing-v2 # least-used free deployment first
  num_retries: 3
  timeout: 600 # long-horizon orchestration needs headroom, not the 5-min default
  allowed_fails: 3
  cooldown_time: 120 # cool a 429ing deployment for 2 min, serve from the rest
  fallbacks:
    - tier1: [tier1-paid]
    - tier2: [tier2-paid]
    - tier3: [tier3-paid]

litellm_settings:
  drop_params: true # heterogeneous providers reject unknown params; drop, don't fail
  num_retries: 3

general_settings:
  master_key: os.environ/LITELLM_MASTER_KEY
