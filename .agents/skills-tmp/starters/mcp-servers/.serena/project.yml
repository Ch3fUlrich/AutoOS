# TRIM THIS to the languages your repo actually contains, and never list one whose
# language server is not in the serena image.
#
# A missing server does NOT degrade to "no symbols for that language". Its initialize
# fails, the language server MANAGER fails with it, and then EVERY symbol tool for the
# project errors with "The language server manager is not initialized" — the whole repo
# goes dark. `markdown` is the usual culprit: marksman is not in the image, and markdown
# has no call graph worth an LSP anyway (headings are a grep). It is deliberately absent
# below. Verified on finance-repo 2026-07-20, which was fully broken by exactly this.
#
# "Proven working" was the wrong bar and is gone: bash, json, python, rust, toml and yaml ALL
# start cleanly. The bar is whether the language has a CALL GRAPH worth an LSP. Measured with
# `serena project health-check`, 2026-09-01, adding one set at a time:
#
#   python, rust  -> picked a Function, 1 match       -> find_referencing_symbols WORKS
#   + json        -> picked `$comment` (.mcp.json)    -> FAILS
#   + toml        -> picked `build-system`            -> FAILS
#   + yaml        -> picked `name`, 13 matches        -> FAILS
#
# Every data-format server floods the symbol namespace with config keys, and none implements
# textDocument/references, so reference lookups break on whatever they surface. Startup also
# went 5s -> 16s with all six. So: declare only the PROGRAMMING languages this repo actually
# contains. json/yaml/toml/markdown are never candidates, however many files match -- a file
# count says a language is worth TESTING, never that it belongs. Serena agrees; its own
# ls_priorities comment rates json as secondary and "never auto-detected".
#
# VERIFY, because activation lies: activate_project reports every declared language as an
# active language server even when its server is dead, and you only find out at the first
# symbol call ("The language server manager is not initialized", naming neither language nor
# cause).
#     SERENA_HOME=/absolute/path/.serena uvx --from serena-agent==1.7.0 serena project health-check .
# Require BOTH "Health check completed successfully" AND a "FindReferencingSymbolsTool found N
# references" line -- AND check WHICH symbol it selected. On Windows it ends in a
# UnicodeEncodeError printing the check mark under cp1252, after the check has finished; the
# exit code is NOT reliable there (measured 1 on 2026-09-01), so read the log, not $?. And a
# run that logs "No class or function found, using first available symbol" and then passes on a
# markdown heading has proved nothing about your call graph -- that is the polluted-namespace
# symptom above. Full detail: skills/mcp-servers-setup/SKILL.md -> Serena.
languages: ["python"]

# NOTE: `project_name` is deliberately ABSENT -- do not add it. Serena fills a missing key
# from the folder name at load (serena_config.py:516-517) and never writes it back to this
# file, so each linked git worktree self-names by its own directory. Declaring it here would
# give every worktree the SAME name, and Serena matches names before paths -- which turns
# by-name activation into `Multiple projects found` for every agent at once. (Read from 1.7.0
# source; not yet tested live, so keep activating by absolute path regardless.)
encoding: "utf-8"
ignore_all_files_in_gitignore: true
ls_specific_settings: {}
additional_workspace_folders: []
ignored_paths: []
read_only: false
excluded_tools: []
included_optional_tools: []
fixed_tools: []
read_only_memory_patterns: []
ignored_memory_patterns: []
