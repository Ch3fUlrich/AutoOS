name: Omnigraph images

# SPEC-OMNI A6: the canonical build of the Omnigraph viewer image.
#
# GitHub-hosted runners build infra/mcp-servers/servers/omnigraph-viewer and
# push SHA-tagged images to GHCR. Deployment pulls
# ghcr.io/<owner>/omnigraph-viewer:<sha>. There is no LAN runner and no
# operator-provided registry on this path: GHCR uses the automatic GITHUB_TOKEN
# (packages: write). Harbor and the local Forgejo runner remain available for
# local test builds only.
#
# SHA tags only - a floating tag would make a deployed image untraceable to the
# commit that produced it. Re-running on the same commit overwrites that SHA
# tag, which is expected.
#
# Publishing is main-only: this trigger has no branch filter (a lane-branch
# push must still prove the Dockerfile builds), so the push step itself is
# gated on github.ref == refs/heads/main instead - the bug that reached main
# (CI 36440796992) was a lane-branch push publishing to the registry.
#
# GHCR/Docker repository names must be all-lowercase; github.repository_owner
# is not guaranteed to be (e.g. "Ch3fUlrich"), and GitHub Actions expressions
# have no toLower() - the same failed run rejected the tag on this ground too.
on:
  push:
    paths:
      - 'infra/mcp-servers/servers/omnigraph-viewer/**'
      - '.github/workflows/omnigraph-images.yml'
  # Manual re-run for a commit whose paths did not change.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  viewer:
    name: Build and push omnigraph-viewer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lowercase the registry owner
        id: owner
        run: echo "lc=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: infra/mcp-servers/servers/omnigraph-viewer
          # Publishing is main-only: a branch build still runs (and would fail
          # CI if the Dockerfile broke) but never writes to the registry.
          push: ${{ github.ref == 'refs/heads/main' }}
          # SHA tag only; never a floating tag. Owner is lowercased (GHCR requirement).
          tags: ghcr.io/${{ steps.owner.outputs.lc }}/omnigraph-viewer:${{ github.sha }}
