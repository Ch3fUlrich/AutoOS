name: Omnigraph images

# SPEC-OMNI A6: the canonical build of the Omnigraph viewer image.
#
# GitHub-hosted runners build infra/mcp-servers/servers/omnigraph-viewer and
# push SHA-tagged images to GHCR. Deployment pulls
# ghcr.io/<owner>/omnigraph-viewer:<sha>. There is no LAN runner and no
# operator-provided registry on this path: GHCR uses the automatic GITHUB_TOKEN
# (packages: write). Harbor and the local Forgejo runner remain available for
# local test builds only.
#
# SHA tags only - a floating tag would make a deployed image untraceable to the
# commit that produced it. Re-running on the same commit overwrites that SHA
# tag, which is expected.
on:
  push:
    paths:
      - 'infra/mcp-servers/servers/omnigraph-viewer/**'
      - '.github/workflows/omnigraph-images.yml'
  # Manual re-run for a commit whose paths did not change.
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  viewer:
    name: Build and push omnigraph-viewer
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: infra/mcp-servers/servers/omnigraph-viewer
          push: true
          # SHA tag only; never a floating tag.
          tags: ghcr.io/${{ github.repository_owner }}/omnigraph-viewer:${{ github.sha }}
