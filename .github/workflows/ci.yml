name: CI

on:
  push:
    branches: [main]
  pull_request:
    # `labeled` re-runs CI when merge-ready is added: that run is the FULL suite.
    types: [opened, synchronize, reopened, labeled]
  workflow_dispatch:
    inputs:
      full:
        description: Run the full suite (a dispatch is always a full run; the input exists so callers can pass it through)
        type: boolean
        default: true

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # CI-SMART-SELECT (D-1475): a PR push runs only what its diff needs (map:
  # .github/smart-ci.json, format docs/ci-smart-select.md). The FULL suite runs on
  # the merge-ready label, workflow_dispatch, every push to main, and whenever the
  # selection is unknown or a workflow / dependency / CI file changed. The
  # "CI merge gate" job at the bottom plus the "Full suite (merge-ready)" status are the required checks.
  smart:
    name: Smart CI select
    uses: ./.github/workflows/smart-ci.yml
    with:
      runs_on: ${{ toJSON((github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","fleet-ci"]') || 'ubuntu-latest') }}
      full: ${{ github.event_name == 'workflow_dispatch' && inputs.full }}

  # WS-CIPAR (2026-09-28): the Linux suite was one serial 11-16 min job. It now
  # runs as parallel shards (tests/ci-shards.txt, one line per shard) next to a
  # separate lint job. The plan job refuses a shard map that leaves a
  # tests/linux part out or runs one twice (tests/ci-shards.py), and the `linux`
  # job keeps the "Linux suite" check name as the one aggregate that passes only
  # when the plan, every shard and the lint job passed.
  linux-plan:
    name: Linux suite plan
    needs: smart
    if: ${{ needs.smart.outputs.full == 'true' || fromJSON(needs.smart.outputs.jobs).shards }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","fleet-ci"]') || 'ubuntu-latest' }}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4

      # Selected mode runs only the shards that hold a selected part (and only
      # those parts); full mode, or a selection naming no part, runs them all.
      - name: Every part in exactly one shard
        id: plan
        env:
          FULL: ${{ needs.smart.outputs.full }}
          SELECTED: ${{ needs.smart.outputs.tests }}
        run: |
          python3 tests/test_ci_shards.py
          only=()
          if [ "$FULL" != "true" ] && [ -n "$SELECTED" ]; then only=(--only "$SELECTED"); fi
          matrix="$(python3 tests/ci-shards.py "${only[@]}")"  # its own line, so its exit code fails the step
          test -n "$matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  linux-shard:
    name: Linux suite shard ${{ matrix.shard }}
    needs: [smart, linux-plan]
    if: ${{ needs.smart.outputs.full == 'true' || fromJSON(needs.smart.outputs.jobs).shards }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","fleet-ci"]') || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.linux-plan.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v4

      # shellcheck/yamllint are also used inside the suite (static-analysis parts).
      - name: Install linters
        run: sudo apt-get update -y && sudo apt-get install -y shellcheck yamllint

      # The suite must never reach the internet (AGENTS.md SS5: tests assert
      # on plans, never install). That rule used to be enforced only by each
      # test stubbing the right commands, and it leaked: the rescue-bootstrap
      # sandbox once let a real `pip install --user oterm` run on this
      # runner. Now it is structural: the suite runs in a fresh network
      # namespace with ONLY loopback up (the loopback HTTP fixture servers
      # still work), dropped back to the runner user. A test that tries the
      # real network fails fast instead of silently depending on it. The
      # canary proves the isolation is actually in effect, so a runner-image
      # change cannot quietly turn this back into an ordinary run.
      # AUTOOS_TEST_PARTS picks this shard's parts; AUTOOS_FULL_SUITE=1 keeps
      # its meaning (the opt-in to an unfiltered run of the selected parts).
      # The parts reach the script through env, never spliced into its text.
      - name: Test suite shard ${{ matrix.shard }} (loopback-only network)
        env:
          SHARD_PARTS: ${{ matrix.parts }}
        run: |
          sudo unshare --net -- bash -c '
            set -e
            ip link set lo up
            if curl -sS --max-time 5 -o /dev/null https://example.com 2>/dev/null; then
              echo "::error::the internet is reachable inside the test namespace - isolation is not in effect"
              exit 1
            fi
            echo "network isolated: loopback only"
            exec setpriv --reuid="$1" --regid="$2" --init-groups \
              env AUTOOS_FULL_SUITE=1 AUTOOS_TEST_PARTS="$6" HOME="$3" USER="$4" PATH="$5" bash tests/run-tests.sh
          ' _ "$(id -u)" "$(id -g)" "$HOME" "$USER" "$PATH" "$SHARD_PARTS"

  linux-lint:
    name: Linux suite lint
    needs: smart
    if: ${{ needs.smart.outputs.full == 'true' || fromJSON(needs.smart.outputs.jobs).lint }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","fleet-ci"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install linters
        run: sudo apt-get update -y && sudo apt-get install -y shellcheck yamllint

      - name: Progress regression tests
        run: |
          python3 tests/test-process.py
          node tests/test-web-progress.js

      - name: shellcheck
        run: |
          shellcheck -S warning setup.sh lib/linux/*.sh tests/run-tests.sh
          for f in tests/linux/*.sh; do shellcheck -S warning "$f" || exit 1; done

      - name: yamllint
        run: |
          yamllint -d '{extends: relaxed, rules: {line-length: {max: 140}}}' \
            catalog/ Windows/ansible/ Linux/ubuntu_autoinstall/ .github/

      - name: Combo contract gate (TORDER)
        run: |
          python3 tools/combo-contract.py
          python3 tools/registry.py render omniroute --check
          python3 tools/registry.py render ide --check
          python3 tools/sync-ide-models.py --check

      - name: Documentation links
        run: python3 tests/check-links.py .

  # The required check keeps its name: "Linux suite" is green only when the
  # plan, every shard and the lint job succeeded (a skipped or cancelled
  # dependency is a failure here, never a pass).
  linux:
    name: Linux suite
    if: always()
    needs: [smart, linux-plan, linux-shard, linux-lint]
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","fleet-ci"]') || 'ubuntu-latest' }}
    steps:
      - name: All shards and lint passed
        env:
          WANT_SHARDS: ${{ needs.smart.outputs.full == 'true' || fromJSON(needs.smart.outputs.jobs).shards }}
          WANT_LINT: ${{ needs.smart.outputs.full == 'true' || fromJSON(needs.smart.outputs.jobs).lint }}
        run: |
          echo "smart=${{ needs.smart.result }} plan=${{ needs.linux-plan.result }} shards=${{ needs.linux-shard.result }} lint=${{ needs.linux-lint.result }}"
          test "${{ needs.smart.result }}" = success
          # skipped passes ONLY for a job the selector left out; a selected job
          # that did not run to success fails here.
          check() { if [ "$2" = true ]; then test "$1" = success; else test "$1" = skipped; fi; }
          check "${{ needs.linux-plan.result }}" "$WANT_SHARDS"
          check "${{ needs.linux-shard.result }}" "$WANT_SHARDS"
          check "${{ needs.linux-lint.result }}" "$WANT_LINT"

  windows:
    name: Windows suite
    # operator 2026-09-27: Windows CI paused until the Linux work is done. It stays
    # off until the repository variable CI_WINDOWS_ENABLED is 'true' (needs a windows
    # fleet-ci runner); the merge gate allows this one skip while it is off and
    # requires success once it is on. Windows runs on full runs only.
    needs: smart
    if: ${{ vars.CI_WINDOWS_ENABLED == 'true' && needs.smart.outputs.full == 'true' }}
    # D-1349: no GitHub-hosted runners. Needs a windows fleet-ci runner before this job is un-gated; with if: false it is never queued.
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","windows","fleet-ci"]') || 'windows-latest' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install PSScriptAnalyzer
        shell: powershell
        run: Install-Module PSScriptAnalyzer -Scope CurrentUser -Force -SkipPublisherCheck

      # Windows has no network namespaces, so this is the practical guard:
      # every download path in the suite goes through curl.exe, which honours
      # these variables, so a test that tries the real network hits a closed
      # port and fails fast. Loopback (the fixture HTTP servers) is exempt.
      - name: Test suite (network via a dead proxy)
        shell: powershell
        env:
          HTTP_PROXY: http://127.0.0.1:9
          HTTPS_PROXY: http://127.0.0.1:9
          NO_PROXY: 127.0.0.1,localhost
        run: .\tests\run-tests.ps1

      - name: Installer and shell regressions (Windows PowerShell)
        shell: powershell
        run: .\tests\test-improvements.ps1

      - name: Installer and shell regressions (PowerShell 7)
        shell: pwsh
        run: .\tests\test-improvements.ps1

      - name: Web progress regressions
        run: node tests/test-web-progress.js

  ansible:
    name: Ansible lint
    needs: smart
    if: ${{ needs.smart.outputs.full == 'true' || fromJSON(needs.smart.outputs.jobs).ansible }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","fleet-ci"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install ansible-lint
        run: pip install "ansible-lint>=24" ansible-core

      - name: Install collections
        run: ansible-galaxy collection install -r Windows/ansible/requirements.yml

      # The tree targets Windows hosts, so a real run cannot happen in CI.
      # Syntax and lint still catch the class of bug that broke it before.
      - name: ansible-lint
        run: ansible-lint Windows/ansible/

      - name: Playbook syntax check
        working-directory: Windows/ansible
        run: |
          cp inventory.example.yml inventory.yml
          ansible-playbook -i inventory.yml main_playbook.yml --syntax-check

  secrets:
    name: Secret scan
    needs: smart
    if: ${{ needs.smart.outputs.full == 'true' || fromJSON(needs.smart.outputs.jobs).secrets }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","fleet-ci"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # This repository has leaked credentials once. A cheap grep for the shapes
      # that leaked is worth more than trusting everyone to remember.
      - name: Reject credential-shaped values in tracked files
        run: |
          set -e
          pattern='(ansible_password|windows_password|vault_[a-z_]*password)\s*[:=]\s*["'"'"']?[^"'"'"'{ ]'
          if git grep -nEI "$pattern" -- . ':!*.example.*' ':!.github/workflows/ci.yml'; then
            echo "::error::A credential-shaped value is present in a tracked file."
            exit 1
          fi
          echo "no inline credentials found"

      - name: Reject committed installers
        run: |
          set -e
          if git ls-files | grep -iE '\.(exe|msi|deb|rpm|dmg|appx|msix)$'; then
            echo "::error::Vendor binaries must not be committed - download them at run time."
            exit 1
          fi
          echo "no committed installers found"

  public-scrub:
    name: Public scrub scan
    needs: smart
    if: ${{ needs.smart.outputs.full == 'true' || fromJSON(needs.smart.outputs.jobs).scrub }}
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","fleet-ci"]') || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan the published trees for site-shaped values
        run: |
          # Generic shapes only (private literals live in gitignored
          # patterns.private.txt, unavailable to CI, and scan-exclude.txt keeps
          # the scrubber's own rules and fixtures out of its own report). Scope
          # is everything this repository publishes about a real machine:
          # infra/ (the imported area) and scripts/, plus docs/, catalog/,
          # README.md and AGENTS.md (SPEC-OMNI A2). A whole-tree run is not
          # used: the heuristic unix-home, rfc1918 and private-host shapes
          # legitimately match test fixtures, example.conf and autoinstall
          # placeholders under tests/, lib/ and configuration/, and this gate
          # must stay green to be worth keeping. `tools/` is included as of
          # 2026-10-01: a leaked absolute path in tools/combo-contract.py reached
          # main unseen while its docs/ copy was caught; the one pre-existing
          # tools/ match (a /home/... example in tools/hostexec/policy.py) is now
          # a placeholder.
          # `.agents/` and `deploy/` join the scope as of 2026-10-10: router skills
          # and the host-unit / hook templates will be published in those two trees, so
          # they are exactly the content this repository says about a real machine and
          # must be scrubbed like the rest. Neither tree is exempted by
          # scan-exclude.txt — only three fixtures that set a throwaway git identity
          # are, each excluded by its exact file.
          python3 scripts/public-scrub/scan.py \
            --patterns scripts/public-scrub/patterns.txt \
            infra/ scripts/ docs/ catalog/ tools/ .agents/ deploy/ README.md AGENTS.md

      # The gate is only as good as patterns.txt: these fixtures fail when a shape
      # stops matching, or when a documentation value starts matching one.
      # Run directly rather than through pytest — this job installs nothing.
      - name: Scanner rule tests
        run: python3 scripts/public-scrub/test_scan.py

  # Merge gate. Red ONLY when a job failed or was cancelled. A selected-only PR run
  # is green here (the fast loop worked) and instead leaves the commit status
  # "Full suite (merge-ready)" PENDING, which blocks merge without a red cross; the
  # merge-ready label (or a dispatch with full=true) runs the full suite and turns
  # that status success. Make this status, plus "CI merge gate", the required checks.
  # A fork PR has a read-only token: the status call is best effort there.
  merge-gate:
    name: CI merge gate
    if: always()
    needs: [smart, linux, ansible, secrets, public-scrub, windows]
    runs-on: ${{ (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && fromJSON('["self-hosted","fleet-ci"]') || 'ubuntu-latest' }}
    permissions:
      contents: read
      statuses: write
    steps:
      - name: Selected jobs passed; report whether the run was full
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVENT: ${{ github.event_name }}
          FULL: ${{ needs.smart.outputs.full }}
          REASON: ${{ needs.smart.outputs.reason }}
          WINDOWS_ENABLED: ${{ vars.CI_WINDOWS_ENABLED }}
          RESULTS: smart=${{ needs.smart.result }} linux=${{ needs.linux.result }} ansible=${{ needs.ansible.result }} secrets=${{ needs.secrets.result }} scrub=${{ needs.public-scrub.result }} windows=${{ needs.windows.result }}
        run: |
          echo "event=$EVENT full=$FULL results=$RESULTS reason=$REASON"
          ctx="Full suite (merge-ready)"
          # curl, not gh: the self-hosted runner image has no gh, and a status that is
          # never posted would leave the full-suite requirement unenforced.
          post() {
            # the token goes in through stdin (-H @-), never into argv where ps could show it
            printf 'Authorization: Bearer %s\n' "$GH_TOKEN" | curl -fsS -X POST -H @- -H "Accept: application/vnd.github+json" \
              "${GITHUB_API_URL:-https://api.github.com}/repos/$REPO/statuses/$SHA" \
              -d "{\"state\":\"$1\",\"context\":\"$ctx\",\"description\":\"$2\"}" >/dev/null \
              || { echo "::error::could not set the $ctx status"; return 1; }
          }
          for pair in $RESULTS; do
            name="${pair%%=*}"; r="${pair#*=}"
            case "$r" in
              success) ;;
              skipped)
                # the one allowed skip in a full run: Windows while it is switched off
                if [ "$FULL" = true ] && ! { [ "$name" = windows ] && [ "$WINDOWS_ENABLED" != true ]; }; then
                  post failure "full run but $name was skipped"; echo "::error::full run but $name was skipped"; exit 1
                fi ;;
              *) post failure "$name ended $r"; echo "::error::$name ended $r"; exit 1 ;;
            esac
          done
          if [ "$EVENT" = pull_request ] && [ "$FULL" != true ]; then
            post pending "selected-only run: add the merge-ready label for the full suite" || exit 1
            echo "::notice::selected-only run passed; the full suite (label merge-ready or dispatch full=true) is still required before merge"
          elif [ "$FULL" = true ]; then
            post success "full suite passed" || exit 1
          else
            post failure "not a full run"; echo "::error::not a pull request and not a full run: refusing to report success"; exit 1
          fi
