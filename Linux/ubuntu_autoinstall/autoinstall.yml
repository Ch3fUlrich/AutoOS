# autoinstall.yaml
version: 1
identity:
  hostname: ubuntu-server
  username: ubuntu
  password: "$6$rounds=4096$somesalt$hashedpassword"
locale: en_US.UTF-8
keyboard:
  layout: us
network:
  version: 2
  ethernets:
    eth0:
      dhcp4: true
storage:
  layout:
    name: lvm
  swap:
    size: 2GB
  config:
    - type: disk
      id: disk0
      ptable: gpt
      wipe: superblock
      grub_device: true
      match:
        size: largest
    - type: partition
      id: boot-partition
      device: disk0
      size: 1G
      flag: boot
    - type: partition
      id: root-partition
      device: disk0
      size: 20G
    - type: lvm_volgroup
      id: vg0
      devices:
        - root-partition
    - type: lvm_partition
      id: lv-root
      volgroup: vg0
      size: 18G
      fstype: ext4
      mount: /
    - type: lvm_partition
      id: lv-swap
      volgroup: vg0
      size: 2G
      fstype: swap
      mount: swap
packages:
  - clang
  - python3
  - python3-pip
  - python3-venv
  - python3-setuptools
  - python3-wheel
  - git
  - initx
  - openbox
  - tmux
  - wireguard
  - w3m
  - firefox-esr
  - nano
  - neovim
  - wget
  - curl
  - htop
  - nmon
  - neofetch
  - mc
  - ansible
  - cron
  - nfs-common
  - rsync
  - zsh
user-data:
  disable_root: false
  timezone: UTC
  runcmd:
    - curl -sL https://raw.githubusercontent.com/Ch3fUlrich/AutoOS/main/Linux/ubuntu_autoinstall/scripts/terminal.sh | bash
    - curl -sL https://raw.githubusercontent.com/Ch3fUlrich/AutoOS/main/Linux/ubuntu_autoinstall/scripts/programming.sh | bash
    - curl -sL https://raw.githubusercontent.com/Ch3fUlrich/AutoOS/main/Linux/ubuntu_autoinstall/scripts/dotfiles.sh | bash
late-commands:
  - echo "Installation complete!" > /target/home/ubuntu/install-complete.txt