# autoinstall.yaml
version: 1
identity:
  hostname: ubuntu-server
  username: ubuntu
  password: "$6$rounds=4096$somesalt$hashedpassword"
locale: en_US.UTF-8
keyboard:
  layout: us
network:
  version: 2
  ethernets:
    eth0:
      dhcp4: true
storage:
  layout:
    name: lvm
  swap:
    size: 2GB
  config:
    - type: disk
      id: disk0
      ptable: gpt
      wipe: superblock
      grub_device: true
      match:
        size: largest
    - type: partition
      id: boot-partition
      device: disk0
      size: 1G
      flag: boot
    - type: partition
      id: root-partition
      device: disk0
      size: 20G
    - type: lvm_volgroup
      id: vg0
      devices:
        - root-partition
    - type: lvm_partition
      id: lv-root
      volgroup: vg0
      size: 18G
      fstype: ext4
      mount: /
    - type: lvm_partition
      id: lv-swap
      volgroup: vg0
      size: 2G
      fstype: swap
      mount: swap
packages:
  - git
  - curl
  - wget
  - sudo
user-data:
  disable_root: false
  timezone: UTC
  runcmd:
    - bash <(curl -sL https://github.com/xpipe-io/xpipe/raw/master/get-xpipe.sh)
    - mkdir -p /home/ubuntu/apps
    - chown -R ubuntu:ubuntu /home/ubuntu
late-commands:
  - curtin in-target --target=/target -- sudo -u ubuntu git clone https://github.com/Ch3fUlrich/AutoOS.git /home/ubuntu/AutoOS
  - curtin in-target --target=/target -- sudo -u ubuntu bash -c 'cd /home/ubuntu/AutoOS/Linux/bash && AUTO_CONFIRM=true bash -c "source config.sh && source modules/utils.sh && source modules/core_packages.sh && install_core_packages && source modules/programming.sh && install_programming_tools && source modules/shell_setup.sh && configure_shell_environment"'
  - echo "Installation complete!" > /target/home/ubuntu/install-complete.txt
