# AutoOS AI client registry.
#
# Installed verbatim to /etc/autoos/ai-clients.conf by
# templates/rescue-bootstrap.sh, and read by the `ai` dispatcher
# (templates/ai-dispatcher.sh, installed to /usr/local/bin/ai).
#
# One record per line: id:binary:description
#
# Adding a third AI CLI later is a one-line addition to THIS file — never a
# change to the dispatcher script or to rescue-bootstrap.sh. Same "catalog is
# data, libraries are code" split as AGENTS.md §2, applied to one alias.
#
# The first field (id) is what a caller types as `ai <id> ...` to pick a
# backend explicitly. The dispatcher's default backend is "claude" unless
# AUTOOS_AI_DEFAULT overrides it — see templates/ai-dispatcher.sh.
claude:claude:Claude Code (Anthropic)
gemini:gemini:Gemini CLI (Google)
