# Install before running any playbook here:
#   ansible-galaxy collection install -r requirements.yml
#
# Nothing declared these before, so a fresh control node failed with an opaque
# "module not found" on the first win_* task.
collections:
  - name: ansible.windows
    version: ">=2.0.0"
  - name: community.windows
    version: ">=2.0.0"
  - name: chocolatey.chocolatey
    version: ">=1.5.0"
