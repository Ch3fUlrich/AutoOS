---
# Installers fetched directly from the vendor at run time.
#
# Nothing here may be a committed binary: redistributing a vendor installer is
# a licence problem and bloats the repository permanently.
#
# Entries with no working URL are omitted rather than left pointing at a
# placeholder - a task that fails on every run trains you to ignore the output.
software_list:
  - name: GlobalProtect
    filename: GlobalProtect64.msi
    url: https://vpn.unibas.ch/global-protect/getmsi.esp?version=64&platform=windows
    install_method: msi
    silent_args: /quiet

  - name: FreeFileSync
    filename: FreeFileSync_Setup.exe
    url: https://freefilesync.org/download/FreeFileSync_13.8_Windows_Setup.exe
    install_method: exe
    silent_args: /silent
